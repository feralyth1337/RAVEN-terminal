name: RAVEN Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RAVEN and pinned Termux source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply RAVEN changes
        run: python3 scripts/patch_termux.py upstream/termux-app

      - name: Build universal debug APK
        working-directory: upstream/termux-app
        env:
          TERMUX_APP_VERSION_NAME: 0.1.0-pre.${{ github.run_number }}
          TERMUX_APK_VERSION_TAG: raven-0.1.0-pre.${{ github.run_number }}
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: "0"
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/dist"
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*universal.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/dist/RAVEN-terminal-0.1.0-pre.${GITHUB_RUN_NUMBER}.apk"
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum ./*.apk > SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAVEN-terminal-pre-release-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="0.1.0-pre.${GITHUB_RUN_NUMBER}"
          TAG="v${VERSION}"
          TITLE="RAVEN Terminal ${VERSION}"
          NOTES="First RAVEN pre-release. Android system shell (/system/bin/sh), HOME=/storage/emulated/0. No Termux bootstrap, apt or bundled Linux userspace."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt --prerelease --title "$TITLE" --notes "$NOTES"
          fi
