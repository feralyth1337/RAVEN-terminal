name: RAVEN Android build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Stable release version (for example 0.1.1). Leave empty to publish a pre-release."
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RAVEN_VERSION: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_version != '' && inputs.release_version) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]') && '0.1.0') || format('0.1.0-pre.{0}', github.run_number) }}
      RAVEN_IS_PRERELEASE: ${{ !((github.event_name == 'workflow_dispatch' && inputs.release_version != '') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))) }}
    steps:
      - name: Checkout RAVEN source (includes pinned Termux sources)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply RAVEN changes
        run: python3 scripts/patch_termux.py upstream/termux-app

      - name: Build universal debug APK
        working-directory: upstream/termux-app
        env:
          TERMUX_APP_VERSION_NAME: ${{ env.RAVEN_VERSION }}
          TERMUX_APK_VERSION_TAG: ${{ format('raven-{0}', env.RAVEN_VERSION) }}
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: "0"
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/dist"
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*universal.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/dist/RAVEN-terminal-${RAVEN_VERSION}.apk"
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum ./*.apk > SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAVEN-terminal-${{ env.RAVEN_VERSION }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$RAVEN_VERSION"
          TAG="v${VERSION}"
          TITLE="RAVEN Terminal ${VERSION}"
          NOTES="RAVEN Terminal ${VERSION}.

          - Android system shell: /system/bin/sh
          - HOME and initial working directory: /storage/emulated/0
          - No Termux bootstrap, apt, PREFIX or bundled Linux userspace
          - User-configured launcher profiles for custom environments"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/SHA256SUMS.txt --clobber
          elif [ "$RAVEN_IS_PRERELEASE" = "true" ]; then
            gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt --prerelease --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt --title "$TITLE" --notes "$NOTES"
          fi
